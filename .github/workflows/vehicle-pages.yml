name: Build searchable vehicle pages
on:
  push:
    branches: [main]
    paths:
      - 'data/used-inventory.json'
      - 'data/equipment-index.json'
      - 'build-vehicle-pages.cjs'
      - 'site-shell.cjs'
      - 'notify-indexnow.cjs'
      - 'indexnow-key.txt'
      - '.github/workflows/vehicle-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vehicle-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build-vehicle-pages.cjs
      - run: node notify-indexnow.cjs --prepare
      - name: Publish generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vehicle-*.html vehicles*.html sitemap-vehicles.xml vehicle-pages-version.json
          if ! git diff --cached --quiet; then
            git commit -m "Update searchable vehicle pages from verified inventory snapshot"
            git push origin HEAD:main
          fi

      - name: Notify search engines after deployment
        run: node notify-indexnow.cjs
