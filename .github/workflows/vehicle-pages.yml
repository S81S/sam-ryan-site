name: Build searchable vehicle pages
on:
  push:
    branches: [main]
    paths:
      - 'data/used-inventory.json'
      - 'data/equipment-index.json'
      - 'build-vehicle-pages.cjs'
      - 'site-shell.cjs'
      - 'notify-indexnow.cjs'
      - 'indexnow-key.txt'
      - 'home-search-examples.json'
      - 'scripts/home-examples.mjs'
      - 'scripts/browser-copies.mjs'
      - 'scripts/complete-titles.mjs'
      - 'title-model.mjs'
      - 'scripts/trim-stock.mjs'
      - 'trim-standard-data.json'
      - 'trim-link.mjs'
      - 'scripts/browser-data.mjs'
      - '.github/workflows/vehicle-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vehicle-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete dealer titles that leave the model out
        run: node scripts/complete-titles.mjs
      - name: Match new vehicles in stock to their factory trims for the Trim Finder
        run: node scripts/trim-stock.mjs
      - name: Keep the files the browser loads in step with the data
        run: node scripts/browser-copies.mjs
      - run: node build-vehicle-pages.cjs
      - run: node notify-indexnow.cjs --prepare
      - name: Keep the home page example searches valid
        run: node scripts/home-examples.mjs || echo "::warning::Example search check failed; pages left unchanged"
      - name: Publish generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # -A with quoted patterns also records pages the build removed (vehicles that left the inventory).
          git add -A -- 'vehicle-*.html' 'vehicles*.html'
          git add sitemap-vehicles.xml vehicle-pages-version.json index.html inventory.html data/used-inventory.json data/used-inventory.js data/vehicle-photos.json data/equipment-index.js data/trim-stock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update searchable vehicle pages from verified inventory snapshot"
            git push origin HEAD:main
          fi

      - name: Notify search engines after deployment
        run: node notify-indexnow.cjs
