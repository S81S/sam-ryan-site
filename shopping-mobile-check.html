<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mobile shopping layout check</title><style>body{background:#111923;color:#fff;font:16px system-ui;margin:20px}label{display:inline-block;margin-right:16px}select,button{font:inherit;padding:10px;margin:6px}iframe{display:block;background:#080b0f;border:2px solid #657589;margin:14px 0;height:740px;max-width:100%}pre{white-space:pre-wrap;font:14px system-ui;max-width:800px}</style></head><body><h1>Mobile shopping layout check</h1><p>Responsive viewport check. Device hardware, virtual keyboards and touch gestures require separate testing.</p><label>Page <select id="page"><option value="/">Home</option><option value="/inventory?q=Ram+1500+Harman+Kardon&amp;condition=Both">Inventory: Harman Kardon</option><option value="/perfect-match?model=ram-1500">Perfect Match</option><option value="/compare?vehicles=1C6SRFLTXMN572362%2C1C6SRFLT0PN573332&amp;condition=Both&amp;q=Ram+1500+Harman+Kardon">Compare</option><option value="/vehicle-1C6RREJP2TN381273">Vehicle details</option><option value="/contact?vehicle=1C6RREJP2TN381273">Contact</option></select></label><label>Width <select id="width"><option>320</option><option selected>390</option><option>430</option><option>768</option></select></label><button id="measure" type="button">Measure layout</button><pre id="result" role="status">Waiting for page…</pre><iframe id="phone" title="Mobile shopping preview" src="/" style="width:390px"></iframe><script>
const phone=document.getElementById('phone'),page=document.getElementById('page'),width=document.getElementById('width'),result=document.getElementById('result');
function measure(){try{const d=phone.contentDocument,w=phone.contentWindow,viewport=d.documentElement.clientWidth,content=d.documentElement.scrollWidth,visible=e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none';};const header=d.querySelector('.site-header'),nav=d.querySelector('#primary-nav'),controls=[...d.querySelectorAll('button,input,select,summary')].filter(visible);const small=controls.filter(e=>{const r=e.getBoundingClientRect();return !['checkbox','radio'].includes(e.type)&&(r.height<44||r.width<44);}).map(e=>({label:e.getAttribute('aria-label')||e.textContent.trim().slice(0,60)||e.id,width:Math.round(e.getBoundingClientRect().width),height:Math.round(e.getBoundingClientRect().height)}));result.textContent=JSON.stringify({page:page.options[page.selectedIndex].text,width:viewport,documentWidth:content,horizontalPageOverflow:content>viewport,headerHeight:header?Math.round(header.getBoundingClientRect().height):null,navigationOpen:nav?.classList.contains('is-open')||false,visibleControls:controls.length,controlsBelow44px:small},null,2);}catch(e){result.textContent='Waiting for the same-origin preview to load.';}}
page.addEventListener('change',()=>{phone.src=page.value;result.textContent='Loading…';});width.addEventListener('change',()=>{phone.style.width=width.value+'px';requestAnimationFrame(measure);});phone.addEventListener('load',()=>{measure();});document.getElementById('measure').addEventListener('click',measure);
</script></body></html>
